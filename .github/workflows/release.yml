name: Release

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Determine version bump
        id: bump
        run: |
          LAST=$(git describe --tags --abbrev=0 2>/dev/null || echo "v0.0.0")
          COMMITS=$(git log ${LAST}..HEAD --pretty=format:"%s")
          BUMP="patch"
          if echo "$COMMITS" | grep -qE "^feat(\(.+\))?!?:|^feat!:"; then BUMP="major"; echo "$COMMITS" | grep -qE "^feat!:" && BUMP="major" || BUMP="minor"; fi
          if echo "$COMMITS" | grep -qE "^feat(\(.+\))?:"; then BUMP="minor"; fi
          if echo "$COMMITS" | grep -qE "^feat!:"; then BUMP="major"; fi
          echo "bump=$BUMP" >> $GITHUB_OUTPUT

      - name: Bump version
        id: version
        run: |
          CURRENT=$(python -c "import json;print(json.load(open('custom_components/aigosmart/manifest.json'))['version'])")
          IFS='.' read -r MAJOR MINOR PATCH <<< "$CURRENT"
          case "${{ steps.bump.outputs.bump }}" in
            major) MAJOR=$((MAJOR+1)); MINOR=0; PATCH=0;;
            minor) MINOR=$((MINOR+1)); PATCH=0;;
            patch) PATCH=$((PATCH+1));;
          esac
          NEW="$MAJOR.$MINOR.$PATCH"
          echo "new=$NEW" >> $GITHUB_OUTPUT
          python - <<EOF
          import json
          p = 'custom_components/aigosmart/manifest.json'
          d = json.load(open(p))
          d['version'] = "$NEW"
          json.dump(d, open(p, 'w'), indent=2)
          EOF

      - name: Commit + tag + release
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add custom_components/aigosmart/manifest.json
          git commit -m "chore(release): v${{ steps.version.outputs.new }}" || exit 0
          git tag "v${{ steps.version.outputs.new }}"
          git push && git push --tags
          gh release create "v${{ steps.version.outputs.new }}" --generate-notes || true
        env:
          GH_TOKEN: ${{ github.token }}
