name: Validate

on:
  push:
    branches: [main, dev]
  pull_request:
  schedule:
    - cron: "0 0 * * *"

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: HA Core Community Validation
        uses: home-assistant/actions/hassfest@master

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install deps
        run: pip install cryptography
      - name: Run unit tests
        run: |
          python -m unittest python_client.tests.test_unit \
                 python_client.tests.test_discovery \
                 python_client.tests.test_ble -v
