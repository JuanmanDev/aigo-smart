name: Validate

on:
  push:
    branches: [main, master, dev]
  pull_request:
  schedule:
    - cron: "0 0 28 * *"

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: HA Core Community Validation
        uses: home-assistant/actions/hassfest@master

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install ruff
        run: pip install ruff==0.16.6
      - name: Ruff
        run: ruff check --output-format=github .

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install deps
        run: pip install cryptography
      - name: Run unit tests
        # every python_client/tests/test_*.py, so a new test file can't be
        # forgotten in a hand-maintained list
        run: |
          python -m unittest -v $(ls python_client/tests/test_*.py | sed 's#/#.#g; s#\.py$##')
