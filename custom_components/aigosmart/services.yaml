sync_devices:
  name: Sync devices
  description: Re-fetch the device list from the AigoSmart cloud and reload the integration.
discover_local:
  name: Discover local devices
  description: Run ALCS multicast discovery on the LAN and log discovered AigoSmart devices.
add_device:
  name: Add device
  description: >
    Start the guided Add-Device flow. Discovers Aigostar devices in pairing mode
    via Bluetooth (when the Home Assistant bluetooth integration is active) and
    via WiFi (devices reported by already-bound devices on the LAN).
set_properties:
  name: Set raw properties (advanced)
  description: >
    Advanced / debugging: write TSL properties to a device exactly as given,
    bypassing the entities. Admin only. Wrong names or values are rejected by
    the cloud or ignored by the device, and a wrong value can switch the
    device or change its settings. Property names and ranges are in the
    device's diagnostics (tsl_model).
  fields:
    device_id:
      name: Device
      description: The AigoSmart device to write to.
      required: true
      selector:
        device:
          integration: aigosmart
    properties:
      name: Properties
      description: 'Property identifiers and values as a mapping, for example LightMode: 1.'
      required: true
      example: '{"WaterGear": 3}'
      selector:
        object:
discover_bluetooth:
  name: Discover Bluetooth devices
  description: >
    Scan for Aigostar BLE devices (Breeze pairing service 0xFEB3) through the
    Home Assistant bluetooth integration and fire aigosmart_ble_found events.
set_feeding_plan:
  name: Set feeding schedule
  description: >
    Replace a pet feeder's whole feeding schedule (adds or removes meals, like
    the app). Each meal runs every day. To change one existing meal, use its
    Meal entities instead.
  fields:
    device_id:
      name: Feeder
      description: The AigoSmart pet feeder.
      required: true
      selector:
        device:
          integration: aigosmart
    meals:
      name: Meals
      description: 'List of meals: time (HH:MM), portions, and optionally enabled (default true).'
      required: true
      example: '[{"time": "07:30", "portions": 2}, {"time": "19:00", "portions": 3}]'
      selector:
        object:
